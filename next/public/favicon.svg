<!-- The mark is the thing the site does: a library laid out as area, one
     rectangle per game, the most played one taking the room it earned.

     Drawn on a 48 grid because that is the size Google's favicon crawler
     wants and the size a browser tab renders. Everything sits inside a 6px
     margin so that the circular mask some surfaces apply - Android home
     screens, a couple of search result layouts - cuts background and never
     a block. Site palette and not a palette of its own: the four colours
     here are bg, accent, accent-d and line-2 out of style.css. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <rect width="48" height="48" fill="#0b0a0e"/>
  <rect x="6"  y="6"  width="20" height="36" fill="#ffb454"/>
  <rect x="28" y="6"  width="14" height="20" fill="#c97f22"/>
  <rect x="28" y="28" width="14" height="14" fill="#4a4458"/>
</svg>
